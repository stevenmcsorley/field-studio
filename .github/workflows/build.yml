name: Build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libgl1-mesa-dev xvfb
          pkg-config --print-errors --exists freetype2 fontconfig
          pkg-config --cflags freetype2 fontconfig
      - name: JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: ea77444750de45e036e0279bb0291144bf8e3688
          path: vendor/JUCE
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build -C Release --output-on-failure
      - name: Test Windows and macOS
        if: runner.os != 'Linux'
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: Field-Studio-${{ runner.os }}
          path: |
            build/FieldStudio_artefacts/Release/Standalone/
            build/FieldStudio_artefacts/Release/VST3/
            build/FieldStudio_artefacts/Release/AU/
  core-sanitizers:
    name: Ownership core ASan and UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure core ownership tests
        run: >-
          cmake -S . -B build-sanitize
          -DFIELD_BUILD_PLUGIN=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_FLAGS_RELEASE="-O1 -g1 -DNDEBUG -fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-sanitize --parallel 2
      - name: Check core ownership and lifetime
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure
