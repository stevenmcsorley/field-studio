name: Build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfreetype-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libgl1-mesa-dev xvfb
      - name: JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: ea77444750de45e036e0279bb0291144bf8e3688
          path: vendor/JUCE
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build -C Release --output-on-failure
      - name: Test Windows and macOS
        if: runner.os != 'Linux'
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: Field-Studio-${{ runner.os }}
          path: |
            build/FieldStudio_artefacts/Release/Standalone/
            build/FieldStudio_artefacts/Release/VST3/
            build/FieldStudio_artefacts/Release/AU/
